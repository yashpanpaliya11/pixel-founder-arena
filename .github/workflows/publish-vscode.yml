name: Publish VS Code extension
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: extensions/vscode
      - run: npm test
        working-directory: extensions/vscode
      - run: npx vsce publish --oidc
        working-directory: extensions/vscode
